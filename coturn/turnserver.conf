# ── Coturn TURN server configuration ──────────────────────────────────────────
# Used for WebRTC NAT traversal when direct peer-to-peer fails (symmetric NATs,
# restrictive firewalls).  Runs on the same VPS as the signaling server.

# Listening ports
listening-port=3478
tls-listening-port=5349

# Use the host network directly (no Docker bridge)
listening-ip=0.0.0.0

# Relay IP range — Docker host-network mode means the container sees the VPS's
# real interfaces, so just relay on the public IP.
relay-ip=23.138.88.186
external-ip=23.138.88.186

# Allocate relay ports from this range ( UDP only — TURN TCP fallback is rarely
# needed for game traffic and adds latency )
min-port=49152
max-port=65535

# ── Authentication ───────────────────────────────────────────────────────────
# Shared-secret mode: the signaling server generates HMAC credentials on the fly
# (see TURN_SHARED_SECRET env var).  Credentials expire after 1 hour.
use-auth-secret
static-auth-secret=retro-cloud-turn-secret-change-me-in-production
# Optional: restrict which origins can use this TURN server
# realm=23.138.88.186

# ── Security ─────────────────────────────────────────────────────────────────
# Disable TLS for now (self-signed certs are more trouble than they're worth
# for an internal TURN server on a private VPS).  Enable when we have proper
# cert automation.
no-tls
no-dtls

# Don't allow peers to loop back through the relay
no-loopback-peers

# Don't proxy LAN traffic
no-multicast-peers

# ── Logging ──────────────────────────────────────────────────────────────────
log-file=stdout
verbose
simple-log

# ── Performance ──────────────────────────────────────────────────────────────
# Game traffic is tiny (controller inputs) but latency-sensitive.  Keep the
# relay buffer small.
relay-threads=2
total-quota=128
stale-nonce=600
max-bps=0
